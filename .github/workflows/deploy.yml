name: Sync upstream and deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '明文源吗'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync 明文源吗 from upstream
        run: |
          set -e
          git remote add upstream https://github.com/regiitx/cfnew.git 2>/dev/null || true
          git fetch upstream
          if git rev-parse --verify upstream/main >/dev/null 2>&1; then UB=main; else UB=master; fi
          echo "upstream branch: $UB"
          git checkout "upstream/$UB" -- '明文源吗'
          if git diff --quiet -- '明文源吗'; then
            echo "no upstream changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add '明文源吗'
            git commit -m 'sync: update 明文源吗 from upstream'
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          set -e
          cp '明文源吗' worker.js
          HTTP_CODE=$(curl -sS -o /tmp/cf_resp.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/cfnew" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2026-09-29","bindings":[{"type":"plain_text","name":"u","text":"${{ secrets.CF_UUID }}"},{"type":"kv_namespace","name":"C","namespace_id":"2653e201653342558328eae6cf08bfdc"}]};type=application/json' \
            -F "worker.js=@worker.js;type=application/javascript+module")
          cat /tmp/cf_resp.json
          echo "HTTP $HTTP_CODE"
          grep -q '"success":[[:space:]]*true' /tmp/cf_resp.json
          sleep 8
          curl -sS -o /dev/null -w '%{http_code}\n' "https://cfnew.q1398579121.workers.dev/" | grep -q "200"
          if curl -sS "https://cfnew.q1398579121.workers.dev/${{ secrets.CF_UUID }}/" | grep -q "UUID错误"; then
            echo "SMOKE FAIL: bindings lost"
            exit 1
          fi
          echo "smoke test OK"
